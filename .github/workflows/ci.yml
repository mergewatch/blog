name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.23.0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:content
      # NEXT_PUBLIC_SHOW_DRAFTS is deliberately "true" here. The point is to
      # prove DEPLOYMENT_ENV=production excludes drafts even when the preview
      # flag is on — the hostile case, not the happy one.
      - name: Build production and verify canonical/index settings
        env:
          DEPLOYMENT_ENV: production
          NEXT_PUBLIC_BASE_PATH: /blog
          NEXT_PUBLIC_SHOW_DRAFTS: "true"
        run: |
          pnpm build
          node --import tsx scripts/verify-build-output.ts production
      - name: Build staging and verify noindex settings
        env:
          DEPLOYMENT_ENV: development
          NEXT_PUBLIC_BASE_PATH: /blog
          NEXT_PUBLIC_SHOW_DRAFTS: "false"
        run: |
          pnpm build
          node --import tsx scripts/verify-build-output.ts staging
